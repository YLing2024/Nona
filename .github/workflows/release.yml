name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            artifact: windows
          - target: linux
            os: ubuntu-latest
            artifact: linux
          - target: android
            os: ubuntu-latest
            artifact: android
          - target: web
            os: ubuntu-latest
            artifact: web
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Package Windows
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath nona-windows.zip

      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build libsecret-1-dev
          flutter build linux --release

      - name: Package Linux
        if: matrix.target == 'linux'
        run: |
          tar -C build/linux/x64/release/bundle -czf nona-linux.tar.gz .

      - name: Build Android (AAB + APK)
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/nona.jks
          fi
          flutter build appbundle --release
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk nona.apk 2>/dev/null || true
          cp build/app/outputs/bundle/release/app-release.aab nona.aab 2>/dev/null || true

      - name: Build Web
        if: matrix.target == 'web'
        run: flutter build web --release

      - name: Package Web
        if: matrix.target == 'web'
        run: tar -C build/web -czf nona-web.tar.gz .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            nona-windows.zip
            nona-linux.tar.gz
            nona.apk
            nona.aab
            nona-web.tar.gz
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
