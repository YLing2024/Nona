name: nona_chat
description: "Nona —— 一款支持多服务商、多模型、自带会话管理与 Agent 预设的 AI 聊天客户端。"
publish_to: 'none'

version: 1.3.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  url_launcher: ^6.3.0
  file_selector: ^1.0.3
  flutter_dotenv: ^5.2.1
  path_provider: ^2.1.5
  flutter_math_fork: ^0.7.4
  flutter_tts: ^4.2.5
  flutter_mermaid: ^0.1.0
  collection: ^1.19.1
  pdf: ^3.12.0
  intl: ^0.20.2
  archive: ^4.0.9
  dynamic_color: 1.7.0
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.42
  html: ^0.15.6
  pdfrx: ^2.2.24
  crypto: ^3.0.7
  gbk_codec: ^0.4.0
  math_expressions: ^2.6.2
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  fl_chart: ^0.69.2
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  dio: ^5.11.0
  socks5_proxy: ^2.1.1
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  hotkey_manager: ^0.2.3
  desktop_drop: ^0.7.1
  cross_file: ^0.3.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.15.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/model_capabilities.json
    - assets/model_prices.json
    - assets/tiktoken/cl100k_base.tiktoken
    - assets/tiktoken/o200k_base.tiktoken
    - assets/fonts/NotoSansSC-Regular.ttf
    - assets/prompts/summary.txt
    - assets/prompts/ocr.txt

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#4F46E5"
    theme_color: "#4F46E5"
